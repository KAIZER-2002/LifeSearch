openapi: 3.0.3
info:
  title: Life Search - Local Search API
  version: 0.1.0
  description: Local HTTP API for the Life Search MVP (desktop app). Default localhost-only usage.
servers:
  - url: http://127.0.0.1:30013
paths:
  /search:
    post:
      summary: Run a natural-language search and return ranked results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
  /document/{documentId}:
    get:
      summary: Retrieve document metadata and optional extracted text
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
  /index:
    post:
      summary: Trigger reindexing for provided paths (on-demand)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paths:
                  type: array
                  items:
                    type: string
                  description: Absolute paths to reindex
                priority:
                  type: boolean
                  description: Whether to prioritize this reindex. Accepted by the server but currently ignored (no behavioral effect yet).
      responses:
        '202':
          description: Reindex scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: scheduled
  /status:
    get:
      summary: Get indexer and index status
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /feedback:
    post:
      summary: Submit user feedback for ranking tuning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '200':
          description: Feedback recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
components:
  schemas:
    SearchRequest:
      type: object
      properties:
        query:
          type: string
          example: "Find that PDF about Qdrant I downloaded around May"
        filters:
          type: object
          properties:
            mime_types:
              type: array
              items:
                type: string
            date_from:
              type: integer
              description: epoch ms
            date_to:
              type: integer
              description: epoch ms
            app_origin:
              type: string
            project:
              type: string
        k:
          type: integer
          description: number of results to return
          default: 10
    SearchResponse:
      type: object
      properties:
        took_ms:
          type: integer
          description: milliseconds
        query_embedding_id:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/ResultCard'
    ResultCard:
      type: object
      properties:
        document_id:
          type: string
        file_name:
          type: string
        path:
          type: string
        mime_type:
          type: string
        snippet:
          type: string
        highlights:
          type: array
          items:
            type: string
        score:
          type: number
        why:
          type: string
        last_opened_ms:
          type: integer
          description: Last time the document was opened (epoch ms). Populated when the document is opened via the CLI or UI; null if never opened.
        thumbnail_path:
          type: string
          description: Path to a cached thumbnail. Not yet populated by the current server (reserved for future UX).
    DocumentResponse:
      type: object
      properties:
        document:
          type: object
          properties:
            id:
              type: string
            path:
              type: string
            file_name:
              type: string
            mime_type:
              type: string
            size:
              type: integer
            content_hash:
              type: string
            created_at:
              type: integer
            modified_at:
              type: integer
            indexed_at:
              type: integer
            last_opened_ms:
              type: integer
              nullable: true
              description: Last time the document was opened (epoch ms). Populated when the document is opened via the CLI or UI; null if never opened.
            metadata_json:
              type: string
        extracted_text:
          type: string
          nullable: true
    StatusResponse:
      type: object
      properties:
        indexed_documents:
          type: integer
        indexed_chunks:
          type: integer
        last_indexed_ms:
          type: integer
        indexing_in_progress:
          type: boolean
        indexing_progress_percent:
          type: number
        model_available:
          type: boolean
          description: Whether a usable embedding model is currently loaded.
        model_id:
          type: string
          nullable: true
          description: Loaded embedding model id, or null if no model is available.
    FeedbackRequest:
      type: object
      properties:
        query:
          type: string
        document_id:
          type: string
        action:
          type: string
          description: 'click | ignore | pin'
          example: click

security: []

# Examples (example responses)

