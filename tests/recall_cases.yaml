# Curated recall test cases for Life Search MVP
# Each case includes: id, query, expected_type (artifact|episode), expected_match (filename pattern or episode hint), notes

cases:
  - id: rc-01
    query: "Find the Qdrant PDF I downloaded around May."
    expected_type: artifact
    expected_match: "*qdrant*\\.pdf"
    notes: "Expect download event evidence and file in Downloads"

  - id: rc-02
    query: "Show me the screenshot where I had the MongoDB error."
    expected_type: artifact
    expected_match: "*mongo*error*.*(png|jpg)"
    notes: "OCR should contain 'MongoDB' or error code"

  - id: rc-03
    query: "What was I working on last Tuesday?"
    expected_type: episode
    expected_match: "episode:date_range:last_tuesday"
    notes: "Return episode summary + dominant entities/apps"

  - id: rc-04
    query: "Find everything related to my JyotishAI work last month."
    expected_type: episode
    expected_match: "project:jyotishai"
    notes: "Expect multiple artifacts and episode clusters"

  - id: rc-05
    query: "Which file did I edit right after reading the Qdrant blog?"
    expected_type: artifact
    expected_match: "*retrieval.py"
    notes: "Expect edit event close to browsing event"

  - id: rc-06
    query: "Find notes that mention QLoRA."
    expected_type: artifact
    expected_match: "*qloRA*|*qlora*|*qlora_notes*"
    notes: "Case-insensitive text match in extracted text"

  - id: rc-07
    query: "Show files I opened between 10pm and 11pm on 2026-08-05."
    expected_type: artifact
    expected_match: "time_range:2026-08-05T22:00:00..2026-08-05T23:00:00"
    notes: "Return artifacts with open events in that interval"

  - id: rc-08
    query: "What did I do before I took this screenshot?"
    expected_type: event_sequence
    expected_match: "relative:before_selected_artifact"
    notes: "Given a selected screenshot, return preceding events in same episode"

  - id: rc-09
    query: "Find the email about deployment I received in June."
    expected_type: artifact
    expected_match: "*deployment*.*(eml|msg|pdf|txt)"
    notes: "Search email subjects/body and attachments"

  - id: rc-10
    query: "Search for the document where I sketched the AI receptionist architecture."
    expected_type: artifact
    expected_match: "*ai-receptionist*.*(docx|pdf|md)"
    notes: "Expect doc with architecture keywords and possible diagram image"

  - id: rc-11
    query: "Show me any terminal commands that contained 'docker-compose' from last week."
    expected_type: event
    expected_match: "event:terminal_command:*docker-compose*"
    notes: "TerminalCommandExecuted events with command substring"

  - id: rc-12
    query: "Find that PDF I printed or saved as 'qdrant' (I don’t remember exact name)."
    expected_type: artifact
    expected_match: "*qdrant*\\.pdf"
    notes: "Fuzzy match on extracted text and filename"

  - id: rc-13
    query: "What did I research before I changed retrieval.py?"
    expected_type: episode
    expected_match: "episode:contains_event:edit:retrieval.py"
    notes: "Find browsing events or notes prior to the edit event"

  - id: rc-14
    query: "Find screenshots taken during my meeting yesterday."
    expected_type: artifact
    expected_match: "time_range:meeting_yesterday & tags:meeting"
    notes: "Episode-based filtering: meeting episodes -> screenshots"

  - id: rc-15
    query: "Show code files I was editing two days ago."
    expected_type: artifact_collection
    expected_match: "time_range:2_days_ago & mime_type:code"
    notes: "Return list of code artifacts with edit events"

  - id: rc-16
    query: "Find everything that mentions 'rate limiting' in my notes."
    expected_type: artifact
    expected_match: "*rate limiting*"
    notes: "Lexical search over extracted text (FTS)"

  - id: rc-17
    query: "What files did I work on last Tuesday?"
    expected_type: artifact_collection
    expected_match: "episode:date:last_tuesday"
    notes: "List artifacts associated with the episode"

  - id: rc-18
    query: "Find the document with the diagram for the monitoring pipeline."
    expected_type: artifact
    expected_match: "*monitoring*pipeline*.(pdf|png|jpg|docx|md)"
    notes: "May be an image or embedded diagram in a doc"

  - id: rc-19
    query: "Which meetings contained mention of 'on-call'?"
    expected_type: episode_collection
    expected_match: "episodes_with_entity:on-call"
    notes: "Search meeting transcripts/notes for entity 'on-call'"

  - id: rc-20
    query: "Find the screenshot where the UI had the red 'Error 500' message."
    expected_type: artifact
    expected_match: "*error*500*.(png|jpg)"
    notes: "OCR should capture 'Error 500' or filename/tagging"
